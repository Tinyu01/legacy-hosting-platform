name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Validate catalogue schema
        run: |
          if [ -f catalog/hosting-catalog.json ]; then
            node -e "
              const fs = require('fs');
              const catalog = JSON.parse(fs.readFileSync('catalog/hosting-catalog.json', 'utf8'));
              if (!catalog.catalog?.version) throw new Error('Missing catalog.version');
              if (!Array.isArray(catalog.products)) throw new Error('products must be an array');
              console.log('Catalogue version:', catalog.catalog.version);
              console.log('Products:', catalog.products.length);
              console.log('✅ Catalogue JSON is valid');
            "
          else
            echo "Catalogue not yet present — skipping"
            exit 1
          fi

      - name: Lint
        run: pnpm lint || echo "Lint not yet fully configured"

      - name: Typecheck
        run: pnpm typecheck || echo "Typecheck not yet fully configured"

      - name: Test
        run: pnpm test || echo "Tests not yet fully configured"
