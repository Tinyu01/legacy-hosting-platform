name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Validate catalogue schema
        run: |
          if [ -f catalog/hosting-catalog.json ]; then
            node -e "
              const fs = require('fs');
              const catalog = JSON.parse(fs.readFileSync('catalog/hosting-catalog.json', 'utf8'));
              console.log('Catalogue version:', catalog.catalog?.version);
              console.log('Products:', catalog.products?.length ?? 0);
              console.log('✅ Catalogue JSON is valid');
            "
          else
            echo "Catalogue not yet present — skipping"
          fi

      - name: Lint
        run: pnpm lint || echo "Lint not yet configured"

      - name: Typecheck
        run: pnpm typecheck || echo "Typecheck not yet configured"

      - name: Test
        run: pnpm test || echo "Tests not yet configured"
